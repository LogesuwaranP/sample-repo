name: Build Vue Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t learning-vue:${{ github.sha }} .

      - name: List Docker images
        run: docker image ls